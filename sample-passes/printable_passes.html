<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartBus Student Passes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f5; color: #1f2937; font-family: Arial, sans-serif; }
    .toolbar { padding: 18px; background: #0d5c3a; color: #fff; text-align: center; }
    .toolbar h1 { margin: 0; font-size: 21px; }
    .toolbar p { margin: 7px 0 13px; color: #d7eee1; font-size: 12px; }
    .print { border: 0; border-radius: 6px; padding: 11px 22px; background: #f59e0b; color: #fff; font-weight: 800; cursor: pointer; }
    .sheet { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; max-width: 1040px; margin: 24px auto; padding: 0 18px; }
    .pass { overflow: hidden; border: 2px solid #0d5c3a; border-radius: 14px; background: #fff; page-break-inside: avoid; }
    .pass-head { padding: 15px; background: #0d5c3a; color: #fff; }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
    .brand-sub { margin-top: 4px; color: #d7eee1; font-size: 9px; font-weight: 800; }
    .pass-body { padding: 16px; }
    .pass-number { color: #0d5c3a; font-size: 11px; font-weight: 900; letter-spacing: 1px; }
    .holder { margin-top: 7px; font-size: 20px; font-weight: 900; }
    .type { display: inline-block; margin-top: 7px; padding: 5px 8px; border-radius: 14px; background: #e7f3ed; color: #0d5c3a; font-size: 10px; font-weight: 900; }
    .meta { margin-top: 15px; padding: 10px; border-radius: 8px; background: #f4f6f9; font-size: 11px; line-height: 1.6; }
    .meta span { display: block; color: #667085; font-size: 9px; font-weight: 800; letter-spacing: .7px; }
    .qr { display: flex; justify-content: center; margin: 18px 0 10px; }
    .pass-id { text-align: center; font-family: monospace; font-size: 11px; font-weight: 900; }
    .validity { margin-top: 5px; color: #667085; text-align: center; font-size: 10px; }
    .footer { margin-top: 14px; padding-top: 10px; border-top: 1px dashed #b9c2ca; color: #667085; font-size: 9px; line-height: 1.5; }
    .footer strong { color: #0d5c3a; }
    @media (max-width: 760px) { .sheet { grid-template-columns: 1fr; max-width: 390px; } }
    @media print { .toolbar { display: none; } body { background: #fff; } .sheet { margin: 0 auto; padding-top: 18px; } .pass { box-shadow: none; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>SmartBus Student Passes</h1>
    <p>APSRTC Palle Velugu route passes for E-POS validation</p>
    <button class="print" type="button" onclick="window.print()">PRINT PASSES</button>
  </header>
  <main class="sheet" id="passes"></main>
  <script>
    const passes = [
      { number: 'PASS 1', holder: 'M. Swapna', id: 'STU-SKLM-2026-01' },
      { number: 'PASS 2', holder: 'A. Krishna', id: 'STU-SKLM-2026-44' },
      { number: 'PASS 3', holder: 'S. Dipesh', id: 'STU-SKLM-2026-92' },
    ];
    const container = document.getElementById('passes');
    passes.forEach((pass, index) => {
      const card = document.createElement('article');
      card.className = 'pass';
      card.innerHTML = `<div class="pass-head"><div class="brand">SMARTBUS</div><div class="brand-sub">APSRTC • PALLE VELUGU</div></div><div class="pass-body"><div class="pass-number">${pass.number}</div><div class="holder">${pass.holder}</div><div class="type">STUDENT</div><div class="meta"><span>PASS ID</span>${pass.id}<span>VALIDITY</span>01 JAN 2026 - 31 DEC 2026</div><div class="qr" id="qr-${index}"></div><div class="pass-id">${pass.id}</div><div class="validity">Present this pass to the conductor E-POS terminal.</div><div class="footer"><strong>SMARTBUS STUDENT PASS</strong><br>QR payload contains the backend pass identifier for validation.</div></div>`;
      container.appendChild(card);
      new QRCode(document.getElementById(`qr-${index}`), { text: JSON.stringify({ pass_id: pass.id }), width: 190, height: 190, colorDark: '#111827', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    });
  </script>
</body>
</html>
