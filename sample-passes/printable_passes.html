<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartBus Student Bus Passes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root { --green: #0b5b3a; --green-dark: #073b29; --mint: #e8f4ed; --ink: #17231f; --muted: #64736c; --line: #ccd8d1; --gold: #c88b20; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf1ef; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .toolbar { padding: 18px; background: var(--green-dark); color: #fff; text-align: center; }
    .toolbar h1 { margin: 0; font-size: 21px; letter-spacing: .8px; }
    .toolbar p { margin: 7px 0 13px; color: #d5e9dd; font-size: 12px; }
    .print { border: 0; border-radius: 5px; padding: 11px 23px; background: var(--gold); color: #fff; font-weight: 900; cursor: pointer; }
    .sheet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; max-width: 1120px; margin: 25px auto; padding: 0 18px; }
    .pass { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 5px 16px rgba(7, 59, 41, .12); page-break-inside: avoid; }
    .pass-head { position: relative; min-height: 93px; padding: 15px 16px 13px 89px; background: var(--green); color: #fff; }
    .pass-head:before { content: ''; position: absolute; left: 16px; top: 15px; width: 54px; height: 54px; border: 2px solid #d5e9dd; border-radius: 50%; background: var(--green-dark); }
    .pass-head:after { content: 'SB'; position: absolute; left: 16px; top: 30px; width: 58px; color: #fff; text-align: center; font-size: 19px; font-weight: 900; letter-spacing: 1px; }
    .brand { font-size: 22px; font-weight: 900; letter-spacing: 2px; }
    .brand-sub { margin-top: 4px; color: #d5e9dd; font-size: 10px; font-weight: 800; letter-spacing: .5px; }
    .pass-body { padding: 15px; }
    .pass-number { color: var(--green); font-size: 10px; font-weight: 900; letter-spacing: 1.3px; }
    .identity { display: flex; align-items: center; gap: 12px; margin-top: 9px; }
    .photo { display: flex; width: 54px; height: 64px; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 6px; background: linear-gradient(#f4f7f5, #dbe8df); color: var(--green); font-size: 25px; font-weight: 900; }
    .holder { font-size: 19px; font-weight: 900; }
    .type { display: inline-block; margin-top: 6px; padding: 5px 8px; border-radius: 12px; background: var(--mint); color: var(--green); font-size: 9px; font-weight: 900; letter-spacing: .5px; }
    .journey { display: grid; grid-template-columns: 1fr auto 1fr; gap: 7px; align-items: center; margin-top: 15px; padding: 10px; border: 1px solid #dbe8df; border-radius: 7px; background: #f7faf8; }
    .journey-label { display: block; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .8px; }
    .journey-value { display: block; margin-top: 4px; font-size: 11px; font-weight: 800; line-height: 1.25; }
    .arrow { color: var(--green); font-size: 19px; font-weight: 900; }
    .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; padding: 10px; border-radius: 7px; background: #f1f5f2; font-size: 10px; }
    .meta span { display: block; margin-bottom: 3px; color: var(--muted); font-size: 8px; font-weight: 900; letter-spacing: .7px; }
    .qr { display: flex; justify-content: center; margin: 15px 0 8px; }
    .pass-id { text-align: center; font-family: monospace; font-size: 11px; font-weight: 900; letter-spacing: .2px; }
    .validity { margin-top: 5px; color: var(--muted); text-align: center; font-size: 9px; }
    .footer { margin-top: 13px; padding-top: 9px; border-top: 1px dashed #b9c8bf; color: var(--muted); font-size: 8px; line-height: 1.45; }
    .footer strong { color: var(--green); letter-spacing: .5px; }
    .project { margin-top: 5px; color: var(--green); font-size: 8px; font-weight: 900; letter-spacing: .8px; }
    @media (max-width: 860px) { .sheet { grid-template-columns: 1fr; max-width: 390px; } }
    @media print { .toolbar { display: none; } body { background: #fff; } .sheet { grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 auto; padding: 12px; } .pass { box-shadow: none; } .pass-head { padding-left: 72px; } .pass-head:before, .pass-head:after { transform: scale(.8); transform-origin: left top; } .brand { font-size: 17px; } .brand-sub { font-size: 8px; } .pass-body { padding: 10px; } .holder { font-size: 16px; } .journey-value { font-size: 9px; } .qr { margin: 10px 0 6px; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>SmartBus Student Bus Passes</h1>
    <p>APSRTC-inspired Palle Velugu route cards for E-POS validation</p>
    <button class="print" type="button" onclick="window.print()">PRINT PASSES</button>
  </header>
  <main class="sheet" id="passes"></main>
  <script>
    const passes = [
      { number: 'PASS 1', holder: 'M. Sameera', id: 'STU-SKLM-2026-01', from: 'Srikakulam RTC Complex', to: 'Kanchili Bypass Bus Stop' },
      { number: 'PASS 2', holder: 'M. Devi', id: 'STU-SKLM-2026-44', from: 'Srikakulam RTC Complex', to: 'Polavaram' },
      { number: 'PASS 3', holder: 'Siva Ram', id: 'STU-SKLM-2026-92', from: 'Tekkali RTC Bus Station', to: 'Kanchili Bypass Bus Stop' },
    ];
    const container = document.getElementById('passes');
    passes.forEach((pass, index) => {
      const card = document.createElement('article');
      card.className = 'pass';
      card.innerHTML = `<div class="pass-head"><div class="brand">APSRTC</div><div class="brand-sub">PALLE VELUGU • STUDENT BUS PASS</div></div><div class="pass-body"><div class="pass-number">${pass.number}</div><div class="identity"><div class="photo">●</div><div><div class="holder">${pass.holder}</div><div class="type">CATEGORY: STUDENT</div></div></div><div class="journey"><div><span class="journey-label">FROM</span><span class="journey-value">${pass.from}</span></div><span class="arrow">→</span><div><span class="journey-label">TO</span><span class="journey-value">${pass.to}</span></div></div><div class="meta"><div><span>PASS ID</span>${pass.id}</div><div><span>VALID UNTIL</span>31 DEC 2026</div></div><div class="qr" id="qr-${index}"></div><div class="pass-id">${pass.id}</div><div class="validity">Present this pass to the conductor E-POS terminal.</div><div class="footer"><strong>SMARTBUS PROJECT • PROJECT DEMONSTRATION</strong><br>Machine-readable project pass. Subject to backend route, validity and permitted-stage validation.<div class="project">SERVICE 4289 • SKLM-1 DEPOT</div></div></div>`;
      container.appendChild(card);
      new QRCode(document.getElementById(`qr-${index}`), { text: JSON.stringify({ pass_id: pass.id }), width: 190, height: 190, colorDark: '#111827', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
    });
  </script>
</body>
</html>
